name: 构建

# 统一的手动构建入口：触发时按平台勾选（可多选），只编你勾的那几个。
# 默认勾上 Android、Windows、TV Android。
#
# 推 tag 时按前缀分侧，不再全量：
#   dev_v*    → 只编 App 版（Windows / Android / Linux / macOS / iOS）
#   dev_tv_v* → 只编 TV 版（TV Android）
#
# 本文件合并了原来的 publish_app_dev.yaml 与 publish_tv_app_dev.yaml。
#
# 关于日志语言：步骤名、进度输出、失败提示都是中文。
# 但 flutter / Gradle / CMake / MSBuild 自己抛的报错是英文硬编码的，改不了；
# GitHub 自己的提示（Node.js 弃用、Process completed with exit code 1）同样改不了。

on:
  workflow_dispatch:
    inputs:
      app_windows:
        description: "Windows (zip / msix)"
        type: boolean
        default: true
      app_android:
        description: "Android (APK)"
        type: boolean
        default: true
      tv_android:
        description: "TV Android (APK)"
        type: boolean
        default: true
      app_linux:
        description: "Linux (deb / zip)"
        type: boolean
        default: false
      app_macos:
        description: "macOS (dmg / zip)"
        type: boolean
        default: false
      app_ios:
        description: "iOS (未签名 ipa)"
        type: boolean
        default: false
  push:
    tags:
      - "dev_v*"
      - "dev_tv_v*"

jobs:
  # ------------------------------------------------------------ Windows
  app-windows:
    name: Windows
    if: ${{ (github.event_name != 'push' || !startsWith(github.ref_name, 'dev_tv_')) && (github.event_name != 'workflow_dispatch' || inputs.app_windows) }}
    # 固定 windows-2022：windows-latest 现在给的是 Visual Studio 18 / MSVC 14.51，
    # 它把 <experimental/coroutine> 标为即将移除，会让 flutter_inappwebview_windows
    # 等插件直接编译失败。上游 1.11.7 也是固定到 windows-2022 的。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      # 说明：这里曾经试过钉 3.38.3 规避 flutter_windows.dll+0x2c4527 的引擎崩溃
      # （该崩溃在 1.11.4/3.38.3 的 114 次记录里从未出现，3.47.1 起才有）。
      # 但改成基于上游 dev（1.11.7）后这条路走不通：dev 的代码用的是
      # ReorderableListView.onReorderItem，需要 Flutter 3.41+，钉 3.38.3 会直接
      # 编译不过（AGENTS.md 也写明两个 Flutter 工程都钉 3.47.1）。
      # 所以统一跟 dev 一致用 3.47.1；引擎崩溃那个风险改由
      # 「返回路径不再调用 windowManager.isFullScreen()」从触发源上消除
      # （见 lib/app/window_state.dart）。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - name: 启用 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      - name: 打包 Windows
        # pwsh 不会因为原生命令失败就中断，所以每条命令后都显式检查退出码，
        # 否则前面失败了、后面成功，整个步骤仍会显示绿色。
        run: |
          $ErrorActionPreference = 'Stop'
          echo "===== 开始：拉取依赖 ====="
          cd simple_live_app
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "拉取依赖失败（退出码 $LASTEXITCODE）" }
          echo "===== 开始：安装打包工具 flutter_distributor ====="
          dart pub global activate flutter_distributor
          if ($LASTEXITCODE -ne 0) { throw "安装 flutter_distributor 失败（退出码 $LASTEXITCODE）" }
          echo "===== 开始：打包 Windows（msix / zip）====="
          flutter_distributor package --platform windows --targets msix,zip --skip-clean
          if ($LASTEXITCODE -ne 0) { throw "打包失败（退出码 $LASTEXITCODE）" }
          echo "===== 完成：产物在 simple_live_app/build/dist ====="

      - uses: actions/upload-artifact@v7
        with:
          name: app-windows
          path: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip
          if-no-files-found: error

      - name: 失败提示
        if: failure()
        run: |
          echo "::error title=Windows 构建失败::往上翻第一条红色报错。按顺序排查：pubspec 依赖冲突 -> Windows 桌面工具链(Visual Studio) -> flutter_distributor 配置。"

  # ------------------------------------------------------------ Android
  app-android:
    name: Android
    if: ${{ (github.event_name != 'push' || !startsWith(github.ref_name, 'dev_tv_')) && (github.event_name != 'workflow_dispatch' || inputs.app_android) }}
    runs-on: ubuntu-24.04
    env:
      # 放到 job 级 env 才能在 step 的 if 里判断；secret 不能直接写进 if。
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v6

      - name: 下载 Android 签名密钥
        id: android_keystore
        if: env.KEYSTORE_BASE64 != ''
        uses: timheuer/base64-to-file@v2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: 生成 key.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "===== 写入签名配置 simple_live_app/android/key.properties ====="
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties
          echo "===== 完成 ====="

      - name: 签名状态
        run: |
          if [ -f simple_live_app/android/key.properties ]; then
            echo "===== 本次使用正式签名 ====="
          else
            echo "::warning title=回退到 debug 签名::仓库没有配置 KEYSTORE_BASE64，本次 APK 用 debug 密钥签名，无法覆盖安装已装的正式签名版本（需先卸载再装）。想要正式签名：仓库 Settings → Secrets and variables → Actions 里添加 KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS。"
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - name: 打包 APK
        run: |
          echo "===== 开始：拉取依赖 ====="
          cd simple_live_app
          flutter pub get
          echo "===== 开始：打包 APK（按 ABI 拆分）====="
          flutter build apk --release --split-per-abi
          echo "===== 完成：产物在 simple_live_app/build/app/outputs/flutter-apk ====="

      - uses: actions/upload-artifact@v7
        with:
          name: app-android
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

      - name: 失败提示
        if: failure()
        run: |
          echo "::error title=Android 构建失败::往上翻第一条红色报错。最常见两种：secret 里的签名密钥(KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS)缺失或写错；Gradle 版本低于 Flutter 要求的最低版本。"

  # --------------------------------------------------------------- TV Android
  # TV 版与 App 版统一用 Flutter 3.47.1，与 simple_live_tv_app/.fvmrc(3.47.1) 一致：
  # 上游 dev 已经把 TV 的 Android 构建栈一起升到 Gradle 8.14 / AGP 8.11.1 / Kotlin 2.2.20。
  tv-android:
    name: TV Android
    if: ${{ (github.event_name != 'push' || startsWith(github.ref_name, 'dev_tv_')) && (github.event_name != 'workflow_dispatch' || inputs.tv_android) }}
    runs-on: ubuntu-24.04
    env:
      TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v6

      - name: 下载 TV 版签名密钥
        id: tv_keystore
        if: env.TV_KEYSTORE_BASE64 != ''
        uses: timheuer/base64-to-file@v2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.TV_KEYSTORE_BASE64 }}

      - name: 生成 key.properties
        if: env.TV_KEYSTORE_BASE64 != ''
        run: |
          echo "===== 写入签名配置 simple_live_tv_app/android/key.properties ====="
          echo "storeFile=${{ steps.tv_keystore.outputs.filePath }}" > simple_live_tv_app/android/key.properties
          echo "storePassword=${{ secrets.TV_STORE_PASSWORD }}" >> simple_live_tv_app/android/key.properties
          echo "keyPassword=${{ secrets.TV_KEY_PASSWORD }}" >> simple_live_tv_app/android/key.properties
          echo "keyAlias=${{ secrets.TV_KEY_ALIAS }}" >> simple_live_tv_app/android/key.properties
          echo "===== 完成 ====="

      - name: 签名状态
        run: |
          if [ -f simple_live_tv_app/android/key.properties ]; then
            echo "===== 本次使用正式签名 ====="
          else
            echo "::warning title=回退到 debug 签名::仓库没有配置 TV_KEYSTORE_BASE64，本次 TV 版 APK 用 debug 密钥签名，无法覆盖安装已装的正式签名版本（需先卸载再装）。想要正式签名：仓库 Settings → Secrets and variables → Actions 里添加 TV_KEYSTORE_BASE64 / TV_STORE_PASSWORD / TV_KEY_PASSWORD / TV_KEY_ALIAS。"
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - name: 打包 APK
        run: |
          echo "===== 开始：拉取依赖 ====="
          cd simple_live_tv_app
          flutter pub get
          echo "===== 开始：打包 TV 版 APK（按 ABI 拆分）====="
          flutter build apk --release --split-per-abi
          echo "===== 完成：产物在 simple_live_tv_app/build/app/outputs/flutter-apk ====="

      - uses: actions/upload-artifact@v7
        with:
          name: tv-android
          path: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

      - name: 失败提示
        if: failure()
        run: |
          echo "::error title=TV 版构建失败::往上翻第一条红色报错。按顺序排查：TV 签名密钥(secret TV_*) -> pubspec 依赖冲突 -> TV 的 Android 构建栈(Gradle 8.14 / AGP 8.11.1)。"

  # ------------------------------------------------------------ Linux
  app-linux:
    name: Linux
    if: ${{ (github.event_name != 'push' || !startsWith(github.ref_name, 'dev_tv_')) && (github.event_name != 'workflow_dispatch' || inputs.app_linux) }}
    # 原来的 ubuntu-22.04 在逐步退役，上游 1.11.7 已改用 ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - name: 安装系统依赖
        run: |
          echo "===== 开始：更新 apt 源 ====="
          sudo apt-get update
          echo "===== 开始：安装编译依赖 ====="
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv
          echo "===== 完成 ====="

      - name: 启用 Linux 桌面支持
        run: flutter config --enable-linux-desktop

      - name: 打包 Linux
        run: |
          echo "===== 开始：拉取依赖 ====="
          cd simple_live_app
          flutter pub get
          echo "===== 开始：安装打包工具 flutter_distributor ====="
          dart pub global activate flutter_distributor
          echo "===== 开始：打包 Linux（deb / zip）====="
          flutter_distributor package --platform linux --targets deb,zip --skip-clean
          echo "===== 完成：产物在 simple_live_app/build/dist ====="

      - uses: actions/upload-artifact@v7
        with:
          name: app-linux
          path: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip
          if-no-files-found: error

      - name: 失败提示
        if: failure()
        run: |
          echo "::error title=Linux 构建失败::往上翻第一条红色报错。最常见是 apt 依赖没装上（libgtk-3-dev / libmpv-dev 等），其次是 flutter_distributor 的打包配置。"

  # ------------------------------------------------------------ macOS
  app-macos:
    name: macOS
    if: ${{ (github.event_name != 'push' || !startsWith(github.ref_name, 'dev_tv_')) && (github.event_name != 'workflow_dispatch' || inputs.app_macos) }}
    # macos-15-intel 默认只带 Xcode 16.4，而解析到的 device_info_plus 12.4.0
    # 用了 iOS 26.1 SDK 新增的 isiOSAppOnVision，Xcode 太旧会编译失败。
    # 固定到 macos-15-intel 并显式切到该镜像已安装的 Xcode 26.3（同上游 1.11.7）。
    runs-on: macos-15-intel
    env:
      XCODE_VERSION: "26.3"
    steps:
      - uses: actions/checkout@v6

      - name: 选择 Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - name: 启用 macOS 桌面支持
        run: flutter config --enable-macos-desktop

      - name: 安装 appdmg
        run: |
          echo "===== 开始：安装 appdmg（打 dmg 用）====="
          npm install -g appdmg
          echo "===== 完成 ====="

      - name: 打包 macOS
        run: |
          echo "===== 开始：拉取依赖 ====="
          cd simple_live_app
          flutter pub get
          echo "===== 开始：安装打包工具 flutter_distributor ====="
          dart pub global activate flutter_distributor
          echo "===== 开始：打包 macOS（dmg / zip）====="
          flutter_distributor package --platform macos --targets dmg,zip --skip-clean
          echo "===== 完成：产物在 simple_live_app/build/dist ====="

      - uses: actions/upload-artifact@v7
        with:
          name: app-macos
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip
          if-no-files-found: error

      - name: 失败提示
        if: failure()
        run: |
          echo "::error title=macOS 构建失败::往上翻第一条红色报错。常见原因是 Xcode 版本、CocoaPods 没装好，或 appdmg/flutter_distributor 安装失败。"

  # ------------------------------------------------------------ iOS
  app-ios:
    name: iOS
    if: ${{ (github.event_name != 'push' || !startsWith(github.ref_name, 'dev_tv_')) && (github.event_name != 'workflow_dispatch' || inputs.app_ios) }}
    # 同 macOS：iOS 侧同样需要 iOS 26.1 SDK（device_info_plus 12.4.0）
    runs-on: macos-15-intel
    env:
      XCODE_VERSION: "26.3"
    steps:
      - uses: actions/checkout@v6

      - name: 选择 Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - name: 打包 IPA
        run: |
          echo "===== 开始：拉取依赖 ====="
          cd simple_live_app
          flutter pub get
          echo "===== 开始：编译 iOS（不签名）====="
          flutter build ios --release --no-codesign
          echo "===== 完成 ====="

      - name: 生成未签名 IPA
        run: |
          echo "===== 开始：把 Runner.app 打成 ios_no_sign.ipa ====="
          cd simple_live_app
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos
          zip -q -r ios_no_sign.ipa Payload
          echo "===== 完成 ====="

      - uses: actions/upload-artifact@v7
        with:
          name: app-ios
          path: simple_live_app/build/ios/iphoneos/ios_no_sign.ipa
          if-no-files-found: error

      - name: 失败提示
        if: failure()
        run: |
          echo "::error title=iOS 构建失败::往上翻第一条红色报错。这里是未签名构建（--no-codesign），不需要证书；报错一般出在 Xcode 版本或 CocoaPods 上。"
